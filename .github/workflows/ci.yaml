name: CI Pipeline

on:
  push:

jobs:
  project-testing:
    runs-on: ubuntu-latest

    env:
      CAPSTONE_TEST: ${{ secrets.CAPSTONE_TEST }}
      MLFLOW_TRACKING_URI: https://dagshub.com/shubhamrangdal2000/MLOPS_CAPSTONE_Project.mlflow
      MLFLOW_TRACKING_USERNAME: shubhamrangdal2000
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline
        run: |
          dvc repro

      - name: Verify MLflow model download
        run: |
          python - <<'PY'
          import mlflow

          print("MLflow URI:", mlflow.get_tracking_uri())
          model = mlflow.pyfunc.load_model("models:/my_model/5")
          print("Model downloaded successfully")
          PY

      - name: Run model tests
        run: |
          python -m unittest tests/test_model.py

      - name: Promote model to production
        run: |
          python scripts/promote_model.py

      - name: Run Flask app tests
        run: |
          python -m unittest tests/test_flask_app.py

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.ECR_REPOSITORY }}:latest \
            .

      - name: Tag Docker image
        run: |
          docker tag \
            ${{ secrets.ECR_REPOSITORY }}:latest \
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPOSITORY }}:latest

      - name: Push Docker image to ECR
        run: |
          docker push \
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPOSITORY }}:latest
name: CI Pipeline

on:
  push:

jobs:
  project-testing:
    runs-on: ubuntu-latest

    env:
      CAPSTONE_TEST: ${{ secrets.CAPSTONE_TEST }}
      MLFLOW_TRACKING_URI: https://dagshub.com/shubhamrangdal2000/MLOPS_CAPSTONE_Project.mlflow
      MLFLOW_TRACKING_USERNAME: shubhamrangdal2000
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check MLflow configuration
        run: |
          python - <<'PY'
          import os
          import mlflow

          print("Tracking URI:", mlflow.get_tracking_uri())
          print("Username configured:", bool(os.getenv("MLFLOW_TRACKING_USERNAME")))
          print("Password configured:", bool(os.getenv("MLFLOW_TRACKING_PASSWORD")))
          PY

      - name: Test model artifact download
        run: |
          python - <<'PY'
          import mlflow

          model_uri = "models:/my_model/5"
          print("Downloading:", model_uri)
          mlflow.artifacts.download_artifacts(artifact_uri=model_uri)
          print("Artifact downloaded successfully")
          PY

      - name: Run pipeline
        run: dvc repro

      - name: Run model tests
        run: python -m unittest tests/test_model.py

      - name: Promote model to production
        run: python scripts/promote_model.py

      - name: Run Flask app tests
        run: python -m unittest tests/test_flask_app.py